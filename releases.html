<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="PALE BURLESQUE" />
    <meta name="theme-color" content="#ffffff" />
    <script src="https://kit.fontawesome.com/a247d1422c.js" crossorigin="anonymous"></script>


    <title>PALE BURLESQUE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />

    <meta property="og:title" content="PALE BURLESQUE" />
    <meta property="og:description" content="ONLINE RECORD LABEL, RADIO STATION, AND ACTIVE LIVE ART INSTALLATION ACROSS THE WORLD" />
    <meta property="og:type" content="website" />
</head>

<body>
    <div class="topnav">
  <a href="/" class="navlogo"><img src="SLOGO.png"></a>
  <a href="releases.html" class="nav">RELEASES</a>
</div>

    <div class="releases-page">
        <div class="releases-section">
            <h1 class="section-title">
                <span id="tab-releases" class="tab active">RELEASES</span>
                <span class="tab-sep">//</span>
                <span id="tab-remixes" class="tab">REMIXES</span>
            </h1>
            <div class="releases-container" id="releases-container"></div>
        </div>

        <!-- 
        <div class="roster-section">
            <h1 class="section-title">ROSTER</h1>
            <div class="roster-container" id="roster-container"></div>
        </div>
        -->
    </div>

    <script>
        // Generic renderer for a list of releases
        function renderReleases(items) {
            const container = document.getElementById('releases-container');
            container.innerHTML = '';

            items.forEach(album => {
                const card = document.createElement('div');
                card.className = 'release-card';

                let streamingLinksHTML = '';
                if (album.streamingLinks && album.streamingLinks.length > 0) {
                    streamingLinksHTML = '<ul class="streaming-links">';
                    album.streamingLinks.forEach(link => {
                        const iconClass = `fa-${link.platform}`;
                        streamingLinksHTML += `
                            <li><a href="${link.url}" target="_blank"><i class="fa-brands ${iconClass}"></i></a></li>
                        `;
                    });
                    streamingLinksHTML += '</ul>';
                }

                card.innerHTML = `
                    <div class="release-image" ${album.coverArt ? `style="background-image: url('${album.coverArt}'); background-size: cover; background-position: center;"` : ''}></div>
                    <div class="release-info">
                        <p class="album-title">${album.title}</p>
                        <p class="album-artist">${album.artist}</p>
                        <p class="album-year">${album.year}</p>
                        ${streamingLinksHTML}
                    </div>
                `;

                container.appendChild(card);
            });
        }

        async function loadAlbums() {
            try {
                const response = await fetch('albums.json');
                const albums = await response.json();
                renderReleases(albums);
            } catch (error) {
                console.error('Error loading albums:', error);
            }
        }

        async function loadRemixes() {
            try {
                const response = await fetch('remixes.json');
                const remixes = await response.json();
                renderReleases(remixes);
            } catch (error) {
                console.error('Error loading remixes:', error);
            }
        }

        function setActiveTab(name) {
            const tabReleases = document.getElementById('tab-releases');
            const tabRemixes = document.getElementById('tab-remixes');
            if (name === 'releases') {
                tabReleases.classList.add('active');
                tabRemixes.classList.remove('active');
            } else {
                tabReleases.classList.remove('active');
                tabRemixes.classList.add('active');
            }
        }

        document.getElementById('tab-releases').addEventListener('click', () => {
            setActiveTab('releases');
            loadAlbums();
        });

        document.getElementById('tab-remixes').addEventListener('click', () => {
            setActiveTab('remixes');
            loadRemixes();
        });

        // Initialize with albums
        setActiveTab('releases');
        loadAlbums();

        // Load roster safely only if roster container exists
        async function loadRoster() {
            try {
                const container = document.getElementById('roster-container');
                if (!container) return;

                const response = await fetch('roster.json');
                const roster = await response.json();

                roster.forEach(member => {
                    const card = document.createElement('div');
                    card.className = 'roster-card';

                    const avatarStyle = member.avatar ? `style="background-image: url('${member.avatar}'); background-size: cover; background-position: center;"` : '';

                    card.innerHTML = `
                        <div class="roster-header">
                            <div class="roster-avatar" ${avatarStyle}></div>
                            <div class="roster-info">
                                <h2 class="roster-name">${member.name}</h2>
                                <p class="roster-pronoun">${member.pronouns}</p>
                            </div>
                        </div>
                        <p class="roster-bio">${member.bio}</p>
                    `;

                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Error loading roster:', error);
            }
        }

        loadRoster();
    </script>

</body>
</html>
