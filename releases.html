<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="PALE BURLESQUE" />
    <meta name="theme-color" content="#ffffff" />
    <script src="https://kit.fontawesome.com/a247d1422c.js" crossorigin="anonymous"></script>


    <title>PALE BURLESQUE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />

    <meta property="og:title" content="PALE BURLESQUE" />
    <meta property="og:description" content="ONLINE RECORD LABEL, RADIO STATION, AND ACTIVE LIVE ART INSTALLATION ACROSS THE WORLD" />
    <meta property="og:type" content="website" />
</head>

<body>
    <div class="topnav">
  <a href="/" class="navlogo"><img src="SLOGO.png"></a>
  <a href="releases.html" class="nav">RELEASES</a>
</div>

    <div class="releases-page">
        <div class="releases-section">
            <h1 class="section-title">RELEASES</h1>
            <div class="releases-container" id="releases-container"></div>
        </div>

        <!-- 
        <div class="roster-section">
            <h1 class="section-title">ROSTER</h1>
            <div class="roster-container" id="roster-container"></div>
        </div>
        -->
    </div>

    <script>
        // Load albums from JSON and render them
        async function loadAlbums() {
            try {
                const response = await fetch('albums.json');
                const albums = await response.json();
                const container = document.getElementById('releases-container');
                
                albums.forEach((album, index) => {
                    const card = document.createElement('div');
                    card.className = 'release-card';
                    card.dataset.albumIndex = index;
                    
                    function renderAlbumContent(currentAlbum) {
                        let streamingLinksHTML = '';
                        if (currentAlbum.streamingLinks && currentAlbum.streamingLinks.length > 0) {
                            streamingLinksHTML = '<ul class="streaming-links">';
                            currentAlbum.streamingLinks.forEach(link => {
                                const iconClass = `fa-${link.platform}`;
                                streamingLinksHTML += `
                                    <li><a href="${link.url}" target="_blank"><i class="fa-brands ${iconClass}"></i></a></li>
                                `;
                            });
                            streamingLinksHTML += '</ul>';
                        }
                        
                        return `
                            <div class="release-image" ${currentAlbum.coverArt ? `style="background-image: url('${currentAlbum.coverArt}'); background-size: cover; background-position: center;"` : ''}></div>
                            <div class="release-info">
                                <p class="album-title">${currentAlbum.title}</p>
                                <div class="release-meta">
                                    <p class="album-artist">${currentAlbum.artist}</p>
                                    <p class="album-year">${currentAlbum.year}</p>
                                </div>
                                ${currentAlbum.hoverText ? `<p class="album-hover">${currentAlbum.hoverText}</p>` : ''}
                                ${streamingLinksHTML}
                            </div>
                        `;
                    }
                    
                    card.innerHTML = renderAlbumContent(album);
                    
                    // Add click handler to toggle alternate if it exists
                    if (album.alternate) {
                        card.style.cursor = 'pointer';
                        let isShowingMain = true;
                        
                        card.addEventListener('click', function(e) {
                            // Don't toggle if clicking on a link
                            if (e.target.closest('a')) return;
                            
                            isShowingMain = !isShowingMain;
                            const dataToShow = isShowingMain ? album : album.alternate;
                            card.innerHTML = renderAlbumContent(dataToShow);
                        });
                    }
                    
                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Error loading albums:', error);
            }
        }
        
        loadAlbums();

        // Load roster from JSON and render them
        async function loadRoster() {
            try {
                const response = await fetch('roster.json');
                const roster = await response.json();
                const container = document.getElementById('roster-container');
                
                roster.forEach(member => {
                    const card = document.createElement('div');
                    card.className = 'roster-card';
                    
                    const avatarStyle = member.avatar ? `style="background-image: url('${member.avatar}'); background-size: cover; background-position: center;"` : '';
                    
                    card.innerHTML = `
                        <div class="roster-header">
                            <div class="roster-avatar" ${avatarStyle}></div>
                            <div class="roster-info">
                                <h2 class="roster-name">${member.name}</h2>
                                <p class="roster-pronoun">${member.pronouns}</p>
                            </div>
                        </div>
                        <p class="roster-bio">${member.bio}</p>
                    `;
                    
                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Error loading roster:', error);
            }
        }
        
        loadRoster();
    </script>

</body>
</html>
